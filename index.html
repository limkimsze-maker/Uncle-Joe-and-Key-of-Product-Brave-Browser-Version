<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uncle Joe and the Key of Product — Brave Desktop</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#070403;color:#fff0b0;font-family:Arial,sans-serif}
#loading{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#070403}
#loading b{font-size:28px;color:#ffd86b}
#loading small{display:block;margin-top:10px;color:#cdbb91}
</style>
</head>
<body>
<div id="loading"><div><b>Loading Product Joe 3D — Brave Edition…</b><small>Using lighter 3D graphics while keeping the original multiplication game.</small></div></div>
<script>
(async function(){
  "use strict";
  const GOOD_HTML=[
    "https://raw.githubusercontent.com/limkimsze-maker/P3-Uncle-Joe-and-the-Key-of-Product-desktop/bae4ec1fb586c3190f61d767187aca389e3c6d51/index.html",
    "https://cdn.jsdelivr.net/gh/limkimsze-maker/P3-Uncle-Joe-and-the-Key-of-Product-desktop@bae4ec1fb586c3190f61d767187aca389e3c6d51/index.html"
  ];
  const VENDOR_BASE="https://cdn.jsdelivr.net/gh/limkimsze-maker/P3-Uncle-Joe-and-the-Key-of-Product-desktop@10851807e6d9802b2e0b74d4f5f9541478ccc8d3/";
  let html="";
  for(const url of GOOD_HTML){
    try{
      const r=await fetch(url,{cache:"no-store",mode:"cors"});
      if(r.ok){
        const t=await r.text();
        if(t && t.indexOf("Uncle Joe and the Key of Product")>=0){html=t;break;}
      }
    }catch(e){}
  }
  if(!html){
    document.getElementById("loading").innerHTML="<div><b>Unable to load the 3D game.</b><small>Please refresh once.</small></div>";
    return;
  }

  // Pin working Three.js support files from the known-good desktop lineage.
  html=html.replaceAll("./vendor/three.min.js",VENDOR_BASE+"vendor/three.min.js");
  html=html.replaceAll("./vendor/GLTFLoader.js",VENDOR_BASE+"vendor/GLTFLoader.js");
  html=html.replaceAll("./vendor/SkeletonUtils.js",VENDOR_BASE+"vendor/SkeletonUtils.js");

  // Brave desktop compatibility profile:
  // 1) reuse the game's built-in low-power 3D path,
  // 2) keep all chambers, geometry, movement, collisions and multiplication logic,
  // 3) use the game's built-in fallback 3D dog / lightweight villager art instead of GLTF models,
  // 4) render at 1x device pixel ratio and avoid forcing the high-performance GPU path.
  html=html.replace(
    'const LOW_POWER = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || Math.min(window.innerWidth, window.innerHeight) < 700;',
    'const LOW_POWER = true;'
  );
  html=html.replace(
    'new THREE.WebGLRenderer({ antialias: false, powerPreference:"high-performance" })',
    'new THREE.WebGLRenderer({ antialias:false, powerPreference:"default", precision:"mediump" })'
  );
  html=html.replace(
    'renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.1));',
    'renderer.setPixelRatio(1);'
  );

  const hook='<script>window.__UJ_BRAVE_DESKTOP_EDITION=true;if(window.THREE){THREE.GLTFLoader=undefined;THREE.SkeletonUtils=undefined;}<\/script>';
  html=html.replace(
    '<script crossorigin="anonymous" src="'+VENDOR_BASE+'vendor/SkeletonUtils.js"><\/script>',
    '<script crossorigin="anonymous" src="'+VENDOR_BASE+'vendor/SkeletonUtils.js"><\/script>'+hook
  );

  // Label this separate copy clearly without changing game mechanics.
  html=html.replace(
    '<title>Uncle Joe and the Key of Product</title>',
    '<title>Uncle Joe and the Key of Product — Brave Desktop</title>'
  );

  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
