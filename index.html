<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uncle Joe and the Key of Product — Brave Desktop 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#070403;color:#fff0b0;font-family:Arial,sans-serif}
#loading{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#070403;z-index:999999}
#loading b{font-size:28px;color:#ffd86b}
#loading small{display:block;margin-top:10px;color:#cdbb91;line-height:1.45}
</style>
</head>
<body>
<div id="loading"><div><b>Loading Product Joe 3D — Brave Edition…</b><small>Same multiplication algorithm and adventure, lighter 3D rendering.</small></div></div>
<script>
(async function(){
  "use strict";

  const SOURCES=[
    "https://raw.githubusercontent.com/limkimsze-maker/P3-Uncle-Joe-and-the-Key-of-Product-desktop/70234e474d80d42fdfb23f0cff99343b05babd48/index.html",
    "https://cdn.jsdelivr.net/gh/limkimsze-maker/P3-Uncle-Joe-and-the-Key-of-Product-desktop@70234e474d80d42fdfb23f0cff99343b05babd48/index.html"
  ];

  let html="";
  for(const url of SOURCES){
    try{
      const r=await fetch(url,{cache:"no-store",mode:"cors"});
      if(r.ok){
        const t=await r.text();
        if(
          t &&
          t.indexOf("Uncle Joe and the Key of Product")>=0 &&
          t.indexOf('document.getElementById("coverStartBtn").addEventListener("click"')>=0 &&
          t.indexOf("MULTIPLICATION QUIZ ENGINE")>=0
        ){
          html=t;
          break;
        }
      }
    }catch(e){}
  }

  if(!html){
    document.getElementById("loading").innerHTML="<div><b>Unable to load Product Joe.</b><small>Please refresh once. The original Product Joe site is untouched.</small></div>";
    return;
  }

  // Separate save data for the Brave edition.
  html=html.replace(
    'const SAVE_KEY = "p3_multiply_egyptian_maze_progress_v1";',
    'const SAVE_KEY = "p3_multiply_egyptian_maze_progress_brave_desktop_v2";'
  );
  html=html.replace(
    'const TEACHER_TOOL_SESSION_KEY = "uncleJoeTeacherToolsUnlocked";',
    'const TEACHER_TOOL_SESSION_KEY = "uncleJoeTeacherToolsUnlockedBraveDesktop";'
  );

  // Keep Reset inside this Brave copy only.
  html=html.replace(
`function clearSavedProgress(){
      try{
        const kill = [];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(!k) continue;
          if(
            k === SAVE_KEY ||
            k.includes("p3_multiply_egyptian_maze") ||
            k.includes("P3-Multiply-Egyptian-Maze") ||
            k.includes("Uncle") ||
            k.includes("uncle") ||
            k.includes("Product") ||
            k.includes("egypt")
          ) kill.push(k);
        }
        kill.forEach(k=>localStorage.removeItem(k));
        localStorage.removeItem(SAVE_KEY);
      }catch(e){}
      try{ sessionStorage.clear(); }catch(e){}
    }`,
`function clearSavedProgress(){
      try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
      try{ sessionStorage.removeItem(TEACHER_TOOL_SESSION_KEY); }catch(e){}
    }`
  );

  // Use the local pinned Three.js r128 build. Do not load GLTF/Skeleton helpers:
  // the original game already contains fallback dog/villager visuals.
  html=html.replace(
    '<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>',
    '<script crossorigin="anonymous" src="./vendor/three.min.js"><\/script>'
  );
  html=html.replace(
    '<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"><\/script>',
    ''
  );
  html=html.replace(
    '<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"><\/script>',
    ''
  );

  // Keep the whole world 3D but use the original game's own low-power branch.
  html=html.replace(
    'const LOW_POWER = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || Math.min(window.innerWidth, window.innerHeight) < 700;',
    'const LOW_POWER = true;'
  );

  // Lighter WebGL settings for Brave desktop.
  html=html.replace(
    'new THREE.WebGLRenderer({ antialias: false, powerPreference:"high-performance" })',
    'new THREE.WebGLRenderer({ antialias:false, powerPreference:"default", precision:"mediump", stencil:false })'
  );
  html=html.replaceAll(
    'renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.1));',
    'renderer.setPixelRatio(1);'
  );

  // Replace PBR Standard materials with simpler Lambert materials.
  // Geometry, movement, collisions, doors, puzzles, questions and algorithm logic are unchanged.
  html=html.replaceAll('new THREE.MeshStandardMaterial(', 'new THREE.MeshLambertMaterial(');

  // After the complete 3D world is built, make structural faces two-sided and
  // disable frustum culling. This targets the missing-wall/pyramid-face issue in Brave.
  const safeScene=`
    try{
      scene.traverse(function(obj){
        if(!obj || !obj.isMesh) return;
        obj.frustumCulled = false;
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach(function(mat){
          if(mat && "side" in mat){
            mat.side = THREE.DoubleSide;
            mat.needsUpdate = true;
          }
        });
      });
    }catch(e){}
`;

  html=html.replace(
    '    initEqualGroupsPuzzle();\n    validateUniqueQuestionBanks();',
    safeScene+'\n    initEqualGroupsPuzzle();\n    validateUniqueQuestionBanks();'
  );

  html=html.replace(
    '<title>Uncle Joe and the Key of Product</title>',
    '<title>Uncle Joe and the Key of Product — Brave Desktop 3D</title>'
  );

  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
