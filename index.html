<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uncle Joe and the Key of Product — Brave 3D Desktop</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#070403;color:#fff0b0;font-family:Arial,sans-serif}
#loading{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;background:#070403;z-index:999999}
#loading>div{max-width:650px;padding:24px;border:2px solid #8b642d;border-radius:18px;background:#1b1007;box-shadow:0 12px 40px #0009}
h1{margin:0 0 10px;color:#ffd86b}.small{color:#d5c39a;line-height:1.5}
</style>
</head>
<body>
<div id="loading"><div><h1>Loading Product Joe — Brave 3D</h1><div class="small">Lightweight 3D renderer · original multiplication algorithm and progression</div></div></div>
<script>
(async function(){
  "use strict";
  const SOURCE="https://raw.githubusercontent.com/limkimsze-maker/P3-Uncle-Joe-and-the-Key-of-Product-desktop/bae4ec1fb586c3190f61d767187aca389e3c6d51/index.html";
  const THREE_SRC="https://raw.githubusercontent.com/limkimsze-maker/P3-Uncle-Joe-and-the-Key-of-Product-desktop/10851807e6d9802b2e0b74d4f5f9541478ccc8d3/vendor/three.min.js";
  try{
    const res=await fetch(SOURCE,{cache:"no-store"});
    if(!res.ok) throw new Error("Source could not be loaded ("+res.status+")");
    let html=await res.text();

    // Freeze this separate edition to its own cache/progress identity.
    html=html.replace(/20260608_cachefix_v3/g,"20260927_brave3d_v1");
    html=html.replace('const SAVE_KEY = "p3_multiply_egyptian_maze_progress_v1";','const SAVE_KEY = "p3_multiply_egyptian_maze_progress_brave3d_v1";');
    html=html.replace('const TEACHER_TOOL_SESSION_KEY = "uncleJoeTeacherToolsUnlocked";','const TEACHER_TOOL_SESSION_KEY = "uncleJoeTeacherToolsUnlockedBrave3D";');

    // Use only the pinned Three.js core. GLTF characters intentionally fall back
    // to the game's built-in low-poly/procedural dog and canvas villagers.
    html=html.replace(
      /<script crossorigin="anonymous" src="\.\/vendor\/three\.min\.js"><\/script>\s*<script crossorigin="anonymous" src="\.\/vendor\/GLTFLoader\.js"><\/script>\s*<script crossorigin="anonymous" src="\.\/vendor\/SkeletonUtils\.js"><\/script>/,
      '<script src="'+THREE_SRC+'"><\\/script>'
    );

    // Brave desktop rendering profile: same world/game logic, cheaper GPU path.
    html=html.replace(/const LOW_POWER = [^;]+;/,'const LOW_POWER = true;');
    html=html.replace(/powerPreference:"high-performance"/g,'powerPreference:"low-power"');
    html=html.replace(/renderer\.setPixelRatio\([^;]+\);/,'renderer.setPixelRatio(1);');
    html=html.replace(/scene\.fog = new THREE\.FogExp2\(0x1d1108,[^;]+\);/,'scene.fog = new THREE.FogExp2(0x1d1108, 0.038);');

    // Lambert keeps real 3D lighting but avoids the heavier Standard/PBR shader.
    html=html.replace(/new THREE\.MeshStandardMaterial\(/g,'new THREE.MeshLambertMaterial(');

    // Keep geometry and interactions, but remove the many local dynamic point lights.
    // Global hemisphere + directional lighting remains, so chambers stay visibly 3D.
    html=html.replace(/new THREE\.PointLight\(/g,'makeBraveLitePointLight(');
    html=html.replace(
      '"use strict";',
      '"use strict";\n    function makeBraveLitePointLight(color,intensity,distance,decay){\n      const light = new THREE.PointLight(color,0,distance,decay);\n      light.visible = false;\n      light.castShadow = false;\n      return light;\n    }'
    );
    html=html.replace(/LOW_POWER \? 0\.46 : 0\.62/g,'1.05');
    html=html.replace(/LOW_POWER \? 0\.32 : 0\.46/g,'0.58');

    // Mark the copy clearly without touching the original game's logic.
    html=html.replace(
      '🏺 Uncle Joe and the Key of Product</div>',
      '🏺 Uncle Joe and the Key of Product <span style="font-size:.65em;opacity:.82">(Brave 3D)</span></div>'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    const box=document.getElementById("loading");
    if(box) box.innerHTML='<div><h1>Unable to start Brave 3D version</h1><div class="small">'+String(err && err.message || err)+'</div></div>';
  }
})();
<\/script>
</body>
</html>
